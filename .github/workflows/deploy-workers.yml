name: Deploy unified Workers service

on:
  push:
    branches: [main]
    paths:
      - gateway/**
      - src/**
      - public/**
      - scripts/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.ts
      - .github/workflows/deploy-workers.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OH_MYSSH_ACCESS_TOKEN: ${{ secrets.OH_MYSSH_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build unified static assets
        run: npm run build

      - name: Typecheck Worker
        run: npm run gateway:typecheck

      - name: Deploy Worker and Assets
        run: npx wrangler deploy --config gateway/wrangler.toml --account-id "$CLOUDFLARE_ACCOUNT_ID"

      - name: Synchronize ACCESS_TOKEN secret
        shell: bash
        run: |
          test -n "$OH_MYSSH_ACCESS_TOKEN"
          printf '%s' "$OH_MYSSH_ACCESS_TOKEN" | npx wrangler secret put ACCESS_TOKEN \
            --config gateway/wrangler.toml --account-id "$CLOUDFLARE_ACCOUNT_ID"
